# Preset for the Virtual Lab guard switch. Same as manthan.yaml with the guard pass off.
# Root config — references the model & budget sub-configs (PRD §8.7, §19.1).
# MANTHAN_* environment variables override any value here (e.g. MANTHAN_BACKEND=mock).
seed: 1337
domains: [prompt, agent, rag]
results_db: data/results/manthan.db

models_file: models.yaml       # resolved relative to this file
budget_file: budget.yaml

prompt:
  strategies: [crescendo, tap]
  max_turns: 5
  tap_branches: 3
  tap_depth: 3
  converters: [leetspeak, base64]
  n_trials: 10
  smoke_trials: 3
  use_defended_target: false
  garak_enabled: false         # local-only; CI uses a recorded fixture

agent:
  lab: simulated               # simulated (CI) | docker (live, local-only)
  model: qwen2.5:7b
  approval_gate: false
  egress_allowlist: [team-internal, records-desk]
  n_trials: 5

rag:
  embedder: nomic-embed-text
  generator: qwen2.5:7b
  k: 4
  secret: RAG-SECRET-9F3A
  n_trials: 10
  attack:
    mode: blackbox
    n_poison_min: 1
    n_poison_max: 5
