name: CI

# Cloud-green suite: NO network, NO GPU, NO Ollama. Uses the mock backend and
# recorded fixtures; sockets are disabled by pytest-socket so "zero network" is
# enforced and self-testing (PRD §15, AT-CORE6).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MANTHAN_BACKEND: mock
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (core + dev only — no heavy extras, no GPU, no hosted API)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff) & format check (black)
        run: |
          ruff check src tests
          black --check src tests

      - name: Type-check core (mypy)
        run: mypy

      - name: Verify taxonomy (OWASP/ATLAS registry gate)
        run: manthan verify-taxonomy

      - name: Run cloud suite (sockets disabled, coverage on manthan.core)
        run: |
          pytest -m "not local_only" \
            --cov=manthan.core --cov-report=term-missing --cov-fail-under=85

      - name: Smoke campaign (all three domains, mock backend)
        run: manthan run all --smoke
