# Agent lab config (PRD §10.3).
lab: simulated            # simulated (CI, no Docker) | docker (live, local-only)
model: qwen2.5:7b         # single tool-calling LLM (agent slot)
approval_gate: false      # optional human-approval gate before tool calls
# Policy allowlist of internal destinations the agent may message. Any other
# destination (e.g. the attacker/collector) is flagged by the runtime monitor.
egress_allowlist:
  - team-internal
  - records-desk
tool_scopes:
  - read_inbox
  - send_message
  - read_file
  - run_cmd            # guarded: allowlisted commands only, sandboxed
n_trials: 5
